<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2140"/>
      <stop offset="100%" stop-color="#4a3466"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7c9d8"/>
      <stop offset="100%" stop-color="#e8a0be"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f2c464"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- lotus petals -->
  <g transform="translate(32,36)">
    <!-- outer petals -->
    <path d="M0,0 C-14,-4 -18,-16 -8,-22 C-4,-14 -2,-6 0,0 Z" fill="url(#petal)" opacity="0.92"/>
    <path d="M0,0 C14,-4 18,-16 8,-22 C4,-14 2,-6 0,0 Z" fill="url(#petal)" opacity="0.92"/>
    <path d="M0,0 C-6,-2 -10,-14 -2,-20 C0,-13 0,-6 0,0 Z" fill="#fbdce6" opacity="0.95"/>
    <path d="M0,0 C6,-2 10,-14 2,-20 C0,-13 0,-6 0,0 Z" fill="#fbdce6" opacity="0.95"/>
    <path d="M0,0 C-3,-3 -3,-16 0,-24 C3,-16 3,-3 0,0 Z" fill="#ffffff" opacity="0.9"/>

    <!-- water/base -->
    <ellipse cx="0" cy="4" rx="20" ry="4" fill="#7dd3c0" opacity="0.35"/>
    <ellipse cx="0" cy="4" rx="20" ry="4" fill="none" stroke="#a9e6d8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- soft glow center accent -->
  <circle cx="32" cy="18" r="2.4" fill="url(#center)"/>
</svg>
